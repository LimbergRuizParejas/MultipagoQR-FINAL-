# ============================
# APP & SERVIDOR
# ============================
spring.application.name=pagos
server.port=8081

# ============================
# BASE DE DATOS (POSTGRESQL)
# ============================
# Configuración para PostgreSQL, cambia los valores según tu base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/multipagos-pagos-service-main
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================
# LOGGING
# ============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================
# SEGURIDAD BÁSICA (para Actuator o login simple)
# ============================
spring.security.user.name=admin
spring.security.user.password=admin123

# ============================
# CLIENTE DE DEUDAS (Billing_service)
# ============================
deudas.client.enabled=true

# ⚠️ Importante: tu Billing_service lo levantaste en el puerto 8001
# y en Django tienes `path('api/', include('debts.urls'))`,
# así que el base-url por defecto debe ir a 8001, no 8000.
deudas.client.base-url=${DEUDAS_CLIENT_BASE_URL:http://127.0.0.1:8001/api}
