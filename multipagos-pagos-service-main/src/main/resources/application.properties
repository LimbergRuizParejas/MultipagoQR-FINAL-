# ============================
# APP & SERVIDOR
# ============================
spring.application.name=pagos
server.port=8081

# ============================
# BASE DE DATOS (H2 EN MEMORIA)
# ============================
# Usamos H2 para desarrollo, así no necesitas tener MySQL levantado.
spring.datasource.url=jdbc:h2:mem:pagos_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Si más adelante quieres usar MySQL, descomenta este bloque
# y comenta el bloque de H2 de arriba:
#
# spring.datasource.url=jdbc:mysql://localhost:3306/pagos_db?createDatabaseIfNotExist=true&serverTimezone=UTC
# spring.datasource.username=multipagos
# spring.datasource.password=multipagos
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================
# LOGGING
# ============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================
# SECURITY BÁSICA (para Actuator o login simple)
# ============================
spring.security.user.name=admin
spring.security.user.password=admin123

# ============================
# CLIENTE DE DEUDAS (Billing_service)
# ============================
deudas.client.enabled=true

# ⚠️ Importante: tu Billing_service lo levantaste en el puerto 8001
# y en Django tienes `path('api/', include('debts.urls'))`,
# así que el base-url por defecto debe ir a 8001, no 8000.
deudas.client.base-url=${DEUDAS_CLIENT_BASE_URL:http://127.0.0.1:8001/api}
