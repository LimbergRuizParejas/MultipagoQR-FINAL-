spring.application.name=Proveedores-Catalogo

# ==============================
# 🔗 CONEXIÓN A POSTGRESQL
# ==============================
# OJO: ajusta el puerto, usuario y contraseña a los de TU Postgres.
# En tu log se ve que intenta usar el usuario "multipagos" y falla la contraseña.
# Si tu usuario real es "postgres" u otro, cámbialo aquí.

spring.datasource.url=jdbc:postgresql://localhost:5433/proveedores_catalogo
spring.datasource.username=multipagos
spring.datasource.password=multipagos
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# ⚙️ JPA / HIBERNATE
# ==============================
# Crea/actualiza tablas según las entidades
spring.jpa.hibernate.ddl-auto=update

# Forzar el dialecto de PostgreSQL (evita el error de "Unable to determine Dialect")
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ver SQL en consola
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# ==============================
# 🧱 LIQUIBASE
# ==============================
# Lo desactivamos por ahora (si tienes changelogs, puedes activarlo)
spring.liquibase.enabled=false

# ==============================
# 📁 SUBIDA DE ARCHIVOS
# ==============================
# Carpeta donde se guardan los archivos subidos (relativa al proyecto)
storage.upload-dir=file

# Tamaños máximos de subida
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==============================
# 🌐 SERVIDOR
# ==============================
# Puerto del microservicio de Proveedores/Catálogo
server.port=8080
