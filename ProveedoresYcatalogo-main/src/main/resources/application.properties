# ==============================
# 🔗 CONEXIÓN A POSTGRESQL
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/proveedores_catalogo
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# ⚙️ JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# 🧱 LIQUIBASE
# ==============================
spring.liquibase.enabled=false

# ==============================
# 📁 SUBIDA DE ARCHIVOS
# ==============================
storage.upload-dir=file
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==============================
# 🌐 SERVIDOR
# ==============================
server.port=8080

# ==============================
# 🔐 SEGURIDAD
# ==============================
# Configura la seguridad de tu aplicación, por ejemplo con JWT o Spring Security
# Cambia las propiedades según el tipo de autenticación y autorización que estés utilizando
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.oauth2.client.registration.google.client-id=your-google-client-id
spring.security.oauth2.client.registration.google.client-secret=your-google-client-secret

# ==============================
# 🔒 CORS
# ==============================
# Habilitar CORS si tu frontend y backend están en dominios diferentes
# Puedes definir los orígenes permitidos, o usar el valor "*" para permitir todos
spring.webflux.cors.allowed-origins=http://localhost:4200
